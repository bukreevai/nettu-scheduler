        bufferBefore:
          type: integer
          format: int64
        bufferAfter:
          type: integer
          format: int64
        closestBookingTime:
          type: integer
          format: int64
          nullable: true
        furthestBookingTime:
          type: integer
          format: int64
          nullable: true

    UpdateServiceUserBody:
      type: object
      properties:
        availability:
          $ref: "#/components/schemas/TimePlan"
        bufferAfter:
          type: integer
          format: int64
          nullable: true
        bufferBefore:
          type: integer
          format: int64
          nullable: true
        closestBookingTime:
          type: integer
          format: int64
          nullable: true
        furthestBookingTime:
          type: integer
          format: int64
          nullable: true

    ServiceBookingSlotDTO:
      type: object
      properties:
        start:
          type: integer
          format: int64
        duration:
          type: integer
          format: int64
        userIds:
          type: array
